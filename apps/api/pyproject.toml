[project]
name = "storyweaver-api"
version = "0.1.0"
description = "StoryWeaver API — from source to story to video."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Heavy / optional capabilities: not needed to boot the API.
ingestion = ["yt-dlp"]
transcription = ["faster-whisper"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: requires a reachable PostgreSQL with pgvector (DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is enforced by `ruff format`

[tool.pyright]
include = ["app", "tests"]
exclude = ["alembic"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportMissingModuleSource = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingParameterType = false
reportUntypedFunctionDecorator = false

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
