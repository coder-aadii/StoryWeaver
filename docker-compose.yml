# Only Postgres is needed for development. Temporal and MinIO are opt-in profiles.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storyweaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storyweaver}
      POSTGRES_DB: ${POSTGRES_DB:-storyweaver}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storyweaver}"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    profiles: ["temporal"]
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233" # web UI

  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-storyweaver}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-storyweaver-dev}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
